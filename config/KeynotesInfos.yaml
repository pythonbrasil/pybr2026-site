    biography_text:
      - br: >-
          Engenheira de software, especialista em Developer Experience e apaixonada por código aberto, Camila também é cofundadora da
          <a href="https://cumbuca.dev/" target="_blank" rel="noopener noreferrer">Cumbuca Dev</a>,
          comunidade que trabalha para tornar o open source mais acessível e inclusivo no Brasil.
      - en: >-
          Software engineer, specialist in Developer Experience, and passionate about open source, Camila is also a co-founder of
          <a href="https://cumbuca.dev/" target="_blank" rel="noopener noreferrer">Cumbuca Dev</a>,
          a community that works to make open source more accessible and inclusive in Brazil.
      - es: >-
